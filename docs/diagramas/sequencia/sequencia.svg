<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="850px" version="1.1" viewBox="0 0 1390 850" width="1390px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="850" width="1390" x="0" y="0" /><text fill="#113047" font-family="DejaVu Sans" font-size="24" font-weight="bold" x="60" y="48">Sequência - enviar mensagem ao empreendedor</text><text fill="#607B8B" font-family="DejaVu Sans" font-size="12" x="60" y="76">LiberRotas | Interação conceitual baseada no módulo de mensagens | 11/11/2026</text><rect fill="#EAF4F4" height="56" rx="8" stroke="#7CADB4" stroke-width="2" width="194" x="38" y="112" /><text fill="#113047" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="135" y="145">Visitante</text><line stroke="#ABC2C9" stroke-dasharray="7,7" stroke-width="2" x1="135" x2="135" y1="168" y2="770" /><rect fill="#D5E4E9" height="12" width="16" x="127" y="792" /><rect fill="#EAF4F4" height="56" rx="8" stroke="#7CADB4" stroke-width="2" width="194" x="273" y="112" /><text fill="#113047" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="370" y="145">Aplicativo</text><line stroke="#ABC2C9" stroke-dasharray="7,7" stroke-width="2" x1="370" x2="370" y1="168" y2="770" /><rect fill="#D5E4E9" height="12" width="16" x="362" y="792" /><rect fill="#EAF4F4" height="56" rx="8" stroke="#7CADB4" stroke-width="2" width="194" x="503" y="112" /><text fill="#113047" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="600" y="145">Firebase Auth</text><line stroke="#ABC2C9" stroke-dasharray="7,7" stroke-width="2" x1="600" x2="600" y1="168" y2="770" /><rect fill="#D5E4E9" height="12" width="16" x="592" y="792" /><rect fill="#EAF4F4" height="56" rx="8" stroke="#7CADB4" stroke-width="2" width="194" x="733" y="112" /><text fill="#113047" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="830" y="145">API LiberRotas</text><line stroke="#ABC2C9" stroke-dasharray="7,7" stroke-width="2" x1="830" x2="830" y1="168" y2="770" /><rect fill="#D5E4E9" height="12" width="16" x="822" y="792" /><rect fill="#EAF4F4" height="56" rx="8" stroke="#7CADB4" stroke-width="2" width="194" x="963" y="112" /><text fill="#113047" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="1060" y="145">PostgreSQL</text><line stroke="#ABC2C9" stroke-dasharray="7,7" stroke-width="2" x1="1060" x2="1060" y1="168" y2="770" /><rect fill="#D5E4E9" height="12" width="16" x="1052" y="792" /><rect fill="#EAF4F4" height="56" rx="8" stroke="#7CADB4" stroke-width="2" width="194" x="1188" y="112" /><text fill="#113047" font-family="DejaVu Sans" font-size="14" text-anchor="middle" x="1285" y="145">Empreendedor</text><line stroke="#ABC2C9" stroke-dasharray="7,7" stroke-width="2" x1="1285" x2="1285" y1="168" y2="770" /><rect fill="#D5E4E9" height="12" width="16" x="1277" y="792" /><line stroke="#067F84" stroke-dasharray="none" stroke-width="2.2" x1="135" x2="370" y1="220" y2="220" /><polygon fill="#067F84" points="370,220 359,215 359,225" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="252.5" y="211">1. Seleciona perfil e escreve mensagem</text><line stroke="#067F84" stroke-dasharray="none" stroke-width="2.2" x1="370" x2="600" y1="290" y2="290" /><polygon fill="#067F84" points="600,290 589,285 589,295" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="485.0" y="281">2. Obtém token de sessão</text><line stroke="#839CA7" stroke-dasharray="7,5" stroke-width="2.2" x1="600" x2="370" y1="345" y2="345" /><polygon fill="#839CA7" points="370,345 381,340 381,350" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="485.0" y="336">3. Retorna identidade autenticada</text><line stroke="#067F84" stroke-dasharray="none" stroke-width="2.2" x1="370" x2="830" y1="415" y2="415" /><polygon fill="#067F84" points="830,415 819,410 819,420" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="600.0" y="406">4. Envia mensagem + identificador idempotente</text><line stroke="#067F84" stroke-dasharray="none" stroke-width="2.2" x1="830" x2="600" y1="478" y2="478" /><polygon fill="#067F84" points="600,478 611,473 611,483" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="715.0" y="469">5. Valida identidade / permissões</text><line stroke="#839CA7" stroke-dasharray="7,5" stroke-width="2.2" x1="600" x2="830" y1="538" y2="538" /><polygon fill="#839CA7" points="830,538 819,533 819,543" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="715.0" y="529">6. Identidade válida</text><line stroke="#067F84" stroke-dasharray="none" stroke-width="2.2" x1="830" x2="1060" y1="600" y2="600" /><polygon fill="#067F84" points="1060,600 1049,595 1049,605" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="945.0" y="591">7. Verifica bloqueio e persiste conversa/mensagem</text><line stroke="#839CA7" stroke-dasharray="7,5" stroke-width="2.2" x1="1060" x2="830" y1="658" y2="658" /><polygon fill="#839CA7" points="830,658 841,653 841,663" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="945.0" y="649">8. Confirma persistência</text><line stroke="#839CA7" stroke-dasharray="7,5" stroke-width="2.2" x1="830" x2="370" y1="712" y2="712" /><polygon fill="#839CA7" points="370,712 381,707 381,717" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="600.0" y="703">9. Retorna confirmação ou erro</text><line stroke="#839CA7" stroke-dasharray="7,5" stroke-width="2.2" x1="370" x2="135" y1="758" y2="758" /><polygon fill="#839CA7" points="135,758 146,753 146,763" /><text fill="#113047" font-family="DejaVu Sans" font-size="12" text-anchor="middle" x="252.5" y="749">10. Atualiza interface</text><text fill="#576F7C" font-family="DejaVu Sans" font-size="12" x="62" y="828">O recebimento pelo empreendedor depende de acesso à conversa; não há garantia de entrega instantânea.</text></svg>